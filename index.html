<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.1);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
        }

        .projects {
            padding: 4rem 0;
        }

        .projects h2 {
            text-align: center;
            font-size: clamp(2rem, 4vw, 2.5rem);
            color: white;
            margin-bottom: 3rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .carousel-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-heavy);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.6s ease;
        }

        .project-card {
            min-width: 100%;
            display: flex;
            flex-direction: column;
        }

        .project-media {
            position: relative;
            height: 50vh;
            min-height: 300px;
            background: #f8f9fa;
            overflow: hidden;
        }

        .project-video,
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-screenshots {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .screenshot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .screenshot.active {
            opacity: 1;
        }

        .media-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .project-content {
            padding: 2rem;
            flex-grow: 1;
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .project-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tech-tag {
            background: var(--primary-gradient);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .carousel-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        .loading,
        .error {
            text-align: center;
            padding: 3rem;
            color: white;
            font-size: 1.1rem;
        }

        .error {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .project-media {
                height: 40vh;
                min-height: 250px;
            }
            
            .project-content {
                padding: 1.5rem;
            }
            
            .nav-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="container">
            <h1>Your Portfolio</h1>
            <p>Showcasing innovative projects and creative solutions</p>
        </div>
    </header>

    <main class="projects">
        <div class="container">
            <h2>Featured Projects</h2>
            <div id="carousel-container">
                <div class="loading">Loading projects...</div>
            </div>
        </div>
    </main>

    <script>
        class Portfolio {
            constructor() {
                this.projects = [];
                this.currentIndex = 0;
                this.screenshotIntervals = new Map();
                this.init();
            }

            async init() {
                try {
                    await this.loadProjects();
                    this.render();
                    this.setupControls();
                } catch (error) {
                    console.error('Portfolio initialization failed:', error);
                    this.showError('Failed to load projects');
                }
            }

            async loadProjects() {
                // Project folders - update this array with your actual project names
                const projectFolders = ['Beat-Em-Up Across The Globe', 'Underneath'];
                
                for (const folder of projectFolders) {
                    try {
                        const project = await this.loadProject(folder);
                        if (project) this.projects.push(project);
                    } catch (error) {
                        console.warn(`Failed to load project ${folder}:`, error);
                    }
                }

                // Fallback to demo projects if none found
                if (this.projects.length === 0) {
                    this.projects = this.getDemoProjects();
                }
            }

            async loadProject(folder) {
                const project = { 
                    folder,
                    title: this.formatTitle(folder),
                    description: 'Project description not found.',
                    technologies: [],
                    media: { video: null, screenshots: [] }
                };

                // Try to load README
                try {
                    const readme = await this.fetchFile(`${folder}/README.md`);
                    if (readme) {
                        const parsed = this.parseMarkdown(readme);
                        Object.assign(project, parsed);
                    }
                } catch (error) {
                    console.warn(`No README found for ${folder}`);
                }

                // Load media files
                project.media = await this.loadMedia(folder);
                
                return project;
            }

            async fetchFile(path) {
                try {
                    const response = await fetch(path);
                    return response.ok ? await response.text() : null;
                } catch (error) {
                    return null;
                }
            }

            parseMarkdown(content) {
                const lines = content.split('\n');
                const result = { technologies: [] };
                
                // Extract title
                const titleLine = lines.find(line => line.startsWith('# '));
                if (titleLine) {
                    result.title = titleLine.replace('# ', '').trim();
                }
                
                // Extract description (first paragraph after title)
                const descriptionStart = lines.findIndex(line => 
                    line.trim() && !line.startsWith('#') && !line.startsWith('![')
                );
                
                if (descriptionStart >= 0) {
                    const descriptionLines = [];
                    for (let i = descriptionStart; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line || line.startsWith('#') || line.startsWith('##')) break;
                        descriptionLines.push(line);
                    }
                    result.description = descriptionLines.join(' ').trim();
                }
                
                // Extract technologies
                const techStart = lines.findIndex(line => 
                    /^##?\s*(tech|stack|built|tools)/i.test(line)
                );
                
                if (techStart >= 0) {
                    for (let i = techStart + 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line || line.startsWith('#')) break;
                        if (line.startsWith('- ')) {
                            result.technologies.push(line.replace('- ', '').trim());
                        }
                    }
                }
                
                return result;
            }

            async loadMedia(folder) {
                const media = { video: null, screenshots: [] };
                
                // Try to find video
                const videoExts = ['mp4', 'webm', 'mov'];
                for (const ext of videoExts) {
                    const videoPath = `${folder}/demo.${ext}`;
                    if (await this.fileExists(videoPath)) {
                        media.video = videoPath;
                        break;
                    }
                }
                
                // Try to find screenshots
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                for (let i = 1; i <= 5; i++) {
                    for (const ext of imageExts) {
                        const imagePath = `${folder}/screenshot${i}.${ext}`;
                        if (await this.fileExists(imagePath)) {
                            media.screenshots.push(imagePath);
                            break;
                        }
                    }
                }
                
                return media;
            }

            async fileExists(path) {
                try {
                    const response = await fetch(path, { method: 'HEAD' });
                    return response.ok;
                } catch (error) {
                    return false;
                }
            }

            formatTitle(folder) {
                return folder
                    .replace(/[-_]/g, ' ')
                    .replace(/\b\w/g, l => l.toUpperCase());
            }

            getDemoProjects() {
                return [
                    {
                        title: "E-Commerce Platform",
                        description: "A full-stack e-commerce solution with modern UI/UX, secure payment processing, and real-time inventory management.",
                        technologies: ["React", "Node.js", "MongoDB", "Stripe", "AWS"],
                        media: { video: null, screenshots: [] }
                    },
                    {
                        title: "AI Chat Assistant",
                        description: "An intelligent conversational AI powered by machine learning algorithms with natural language processing capabilities.",
                        technologies: ["Python", "TensorFlow", "FastAPI", "React", "Docker"],
                        media: { video: null, screenshots: [] }
                    },
                    {
                        title: "Portfolio Dashboard",
                        description: "A comprehensive analytics dashboard for tracking project performance and user engagement with real-time data visualization.",
                        technologies: ["Vue.js", "D3.js", "Express", "PostgreSQL", "Redis"],
                        media: { video: null, screenshots: [] }
                    }
                ];
            }

            render() {
                const container = document.getElementById('carousel-container');
                
                if (this.projects.length === 0) {
                    container.innerHTML = '<div class="error">No projects found</div>';
                    return;
                }

                container.innerHTML = `
                    <div class="carousel-wrapper">
                        <div class="carousel-track" id="carousel-track">
                            ${this.projects.map(project => this.renderProject(project)).join('')}
                        </div>
                    </div>
                    ${this.renderControls()}
                `;
            }

            renderProject(project) {
                const mediaHTML = this.renderMedia(project.media);
                const techHTML = project.technologies
                    .map(tech => `<span class="tech-tag">${tech}</span>`)
                    .join('');

                return `
                    <article class="project-card">
                        <div class="project-media">
                            ${mediaHTML}
                        </div>
                        <div class="project-content">
                            <h3 class="project-title">${project.title}</h3>
                            <p class="project-description">${project.description}</p>
                            <div class="tech-stack">${techHTML}</div>
                        </div>
                    </article>
                `;
            }

            renderMedia(media) {
                if (media.video) {
                    return `<video class="project-video" controls muted>
                        <source src="${media.video}" type="video/mp4">
                        Video not supported
                    </video>`;
                }
                
                if (media.screenshots.length > 0) {
                    return `
                        <div class="project-screenshots">
                            ${media.screenshots.map((screenshot, index) => 
                                `<img src="${screenshot}" alt="Screenshot ${index + 1}" class="screenshot ${index === 0 ? 'active' : ''}">`
                            ).join('')}
                        </div>
                    `;
                }
                
                return '<div class="media-placeholder">No media available</div>';
            }

            renderControls() {
                if (this.projects.length <= 1) return '';

                return `
                    <div class="carousel-nav">
                        <button class="nav-btn" id="prev-btn">← Previous</button>
                        <button class="nav-btn" id="next-btn">Next →</button>
                    </div>
                    <div class="carousel-dots">
                        ${this.projects.map((_, index) => 
                            `<button class="dot ${index === 0 ? 'active' : ''}" data-index="${index}"></button>`
                        ).join('')}
                    </div>
                `;
            }

            setupControls() {
                const prevBtn = document.getElementById('prev-btn');
                const nextBtn = document.getElementById('next-btn');
                const dots = document.querySelectorAll('.dot');

                prevBtn?.addEventListener('click', () => this.goToPrevious());
                nextBtn?.addEventListener('click', () => this.goToNext());

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => this.goToSlide(index));
                });

                this.setupScreenshotRotation();
            }

            setupScreenshotRotation() {
                const screenshotContainers = document.querySelectorAll('.project-screenshots');
                
                screenshotContainers.forEach((container, containerIndex) => {
                    const screenshots = container.querySelectorAll('.screenshot');
                    
                    if (screenshots.length > 1) {
                        let currentIndex = 0;
                        
                        const interval = setInterval(() => {
                            screenshots[currentIndex].classList.remove('active');
                            currentIndex = (currentIndex + 1) % screenshots.length;
                            screenshots[currentIndex].classList.add('active');
                        }, 3000);
                        
                        this.screenshotIntervals.set(containerIndex, interval);
                    }
                });
            }

            goToPrevious() {
                this.currentIndex = this.currentIndex > 0 ? this.currentIndex - 1 : this.projects.length - 1;
                this.updateCarousel();
            }

            goToNext() {
                this.currentIndex = (this.currentIndex + 1) % this.projects.length;
                this.updateCarousel();
            }

            goToSlide(index) {
                this.currentIndex = index;
                this.updateCarousel();
            }

            updateCarousel() {
                const track = document.getElementById('carousel-track');
                const dots = document.querySelectorAll('.dot');
                
                track.style.transform = `translateX(-${this.currentIndex * 100}%)`;
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === this.currentIndex);
                });
            }

            showError(message) {
                const container = document.getElementById('carousel-container');
                container.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new Portfolio();
        });
    </script>
</body>
</html>
