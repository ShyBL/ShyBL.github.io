<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out;
        }

        .hero p {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .projects-section {
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 3rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .carousel {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .project-card {
            min-width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-media {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .project-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-screenshots {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }

        .project-screenshot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .media-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .project-card:hover .media-overlay {
            opacity: 1;
        }

        .project-content {
            padding: 2rem;
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 1rem;
        }

        .project-description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: 1.5rem;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tech-tag {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .carousel-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            text-align: center;
            padding: 4rem 2rem;
            color: #ff6b6b;
            font-size: 1.2rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .hero p {
                font-size: 1.1rem;
            }
            
            .project-media {
                height: 250px;
            }
            
            .project-content {
                padding: 1.5rem;
            }
            
            .nav-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Your Portfolio</h1>
        <p>Showcasing innovative projects and creative solutions</p>
    </div>

    <div class="projects-section">
        <h2 class="section-title">Featured Projects</h2>
        <div id="projectsContainer" class="loading">
            Loading projects...
        </div>
    </div>

    <script>
        class PortfolioCarousel {
            constructor() {
                this.projects = [];
                this.currentIndex = 0;
                this.init();
            }

            async init() {
                try {
                    await this.loadProjects();
                    this.render();
                    this.setupEventListeners();
                } catch (error) {
                    this.showError('Failed to load projects. Please check your project structure.');
                }
            }

            async loadProjects() {
                // In a real GitHub Pages deployment, you would need to manually maintain this list
                // or use GitHub API to fetch repository contents
                const projectFolders = [
                    'project1',
                    'project2', 
                    'project3'
                    // Add your project folder names here
                ];

                for (const folder of projectFolders) {
                    try {
                        const project = await this.loadProjectFromFolder(folder);
                        if (project) {
                            this.projects.push(project);
                        }
                    } catch (error) {
                        console.warn(`Failed to load project ${folder}:`, error);
                    }
                }

                if (this.projects.length === 0) {
                    // Demo projects if no real projects are found
                    this.projects = this.getDemoProjects();
                }
            }

            async loadProjectFromFolder(folderName) {
                try {
                    // Try to load README.md
                    const readmeResponse = await fetch(`${folderName}/README.md`);
                    const readmeText = readmeResponse.ok ? await readmeResponse.text() : '';
                    
                    // Parse markdown content
                    const { title, description, technologies } = this.parseMarkdown(readmeText, folderName);
                    
                    // Look for media files
                    const media = await this.findMediaFiles(folderName);
                    
                    return {
                        title,
                        description,
                        technologies,
                        media,
                        folder: folderName
                    };
                } catch (error) {
                    console.warn(`Error loading project ${folderName}:`, error);
                    return null;
                }
            }

            parseMarkdown(content, fallbackTitle) {
                const lines = content.split('\n');
                let title = fallbackTitle;
                let description = '';
                let technologies = [];
                
                // Extract title from first heading
                const titleMatch = lines.find(line => line.startsWith('# '));
                if (titleMatch) {
                    title = titleMatch.substring(2).trim();
                }
                
                // Extract description from content
                const descriptionLines = lines.filter(line => 
                    line.trim() && 
                    !line.startsWith('#') && 
                    !line.startsWith('##') && 
                    !line.startsWith('![') &&
                    !line.startsWith('- ')
                );
                
                description = descriptionLines.slice(0, 3).join(' ').trim();
                
                // Extract technologies from a "Technologies" section or similar
                const techSection = lines.findIndex(line => 
                    line.toLowerCase().includes('tech') || 
                    line.toLowerCase().includes('built with') ||
                    line.toLowerCase().includes('stack')
                );
                
                if (techSection !== -1) {
                    const techLines = lines.slice(techSection + 1, techSection + 10);
                    technologies = techLines
                        .filter(line => line.startsWith('- '))
                        .map(line => line.substring(2).trim())
                        .slice(0, 5);
                }
                
                return { title, description, technologies };
            }

            async findMediaFiles(folderName) {
                const media = {
                    video: null,
                    screenshots: []
                };
                
                // Common video extensions
                const videoExtensions = ['mp4', 'webm', 'mov', 'avi'];
                const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                
                // Try to find video file
                for (const ext of videoExtensions) {
                    try {
                        const videoPath = `${folderName}/demo.${ext}`;
                        const response = await fetch(videoPath, { method: 'HEAD' });
                        if (response.ok) {
                            media.video = videoPath;
                            break;
                        }
                    } catch (error) {
                        // File doesn't exist, continue
                    }
                }
                
                // Try to find screenshot files
                for (let i = 1; i <= 5; i++) {
                    for (const ext of imageExtensions) {
                        try {
                            const imagePath = `${folderName}/screenshot${i}.${ext}`;
                            const response = await fetch(imagePath, { method: 'HEAD' });
                            if (response.ok) {
                                media.screenshots.push(imagePath);
                                break;
                            }
                        } catch (error) {
                            // File doesn't exist, continue
                        }
                    }
                }
                
                return media;
            }

            getDemoProjects() {
                return [
                    {
                        title: "E-Commerce Platform",
                        description: "A full-stack e-commerce solution with modern UI/UX, secure payment processing, and real-time inventory management. Built with scalability and performance in mind.",
                        technologies: ["React", "Node.js", "MongoDB", "Stripe", "AWS"],
                        media: { video: null, screenshots: [] },
                        folder: "demo1"
                    },
                    {
                        title: "AI Chat Assistant",
                        description: "An intelligent conversational AI powered by machine learning algorithms. Features natural language processing, context awareness, and multi-language support.",
                        technologies: ["Python", "TensorFlow", "FastAPI", "React", "Docker"],
                        media: { video: null, screenshots: [] },
                        folder: "demo2"
                    },
                    {
                        title: "Portfolio Dashboard",
                        description: "A comprehensive analytics dashboard for tracking project performance, user engagement, and business metrics. Features real-time data visualization and reporting.",
                        technologies: ["Vue.js", "D3.js", "Express", "PostgreSQL", "Redis"],
                        media: { video: null, screenshots: [] },
                        folder: "demo3"
                    }
                ];
            }

            render() {
                const container = document.getElementById('projectsContainer');
                
                if (this.projects.length === 0) {
                    container.innerHTML = '<div class="error">No projects found. Please add project folders to your repository.</div>';
                    return;
                }

                const carouselHTML = `
                    <div class="carousel-container">
                        <div class="carousel" id="carousel">
                            ${this.projects.map(project => this.createProjectCard(project)).join('')}
                        </div>
                    </div>
                    <div class="carousel-nav">
                        <button class="nav-btn" id="prevBtn">← Previous</button>
                        <button class="nav-btn" id="nextBtn">Next →</button>
                    </div>
                    <div class="carousel-dots" id="dots">
                        ${this.projects.map((_, index) => `
                            <div class="dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>
                        `).join('')}
                    </div>
                `;

                container.innerHTML = carouselHTML;
            }

            createProjectCard(project) {
                const mediaHTML = this.createMediaHTML(project.media);
                const techTags = project.technologies.map(tech => 
                    `<span class="tech-tag">${tech}</span>`
                ).join('');

                return `
                    <div class="project-card">
                        <div class="project-media">
                            ${mediaHTML}
                            <div class="media-overlay">
                                <span>View Project</span>
                            </div>
                        </div>
                        <div class="project-content">
                            <h3 class="project-title">${project.title}</h3>
                            <p class="project-description">${project.description}</p>
                            <div class="project-tech">
                                ${techTags}
                            </div>
                        </div>
                    </div>
                `;
            }

            createMediaHTML(media) {
                if (media.video) {
                    return `<video class="project-video" controls muted>
                        <source src="${media.video}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>`;
                } else if (media.screenshots.length > 0) {
                    return `
                        <div class="project-screenshots" id="screenshots-${Date.now()}">
                            ${media.screenshots.map(screenshot => 
                                `<img src="${screenshot}" alt="Project Screenshot" class="project-screenshot">`
                            ).join('')}
                        </div>
                    `;
                } else {
                    return `<div style="display: flex; align-items: center; justify-content: center; height: 100%; background: linear-gradient(45deg, #667eea, #764ba2); color: white; font-size: 1.2rem; font-weight: 600;">
                        No media available
                    </div>`;
                }
            }

            setupEventListeners() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const dots = document.querySelectorAll('.dot');

                prevBtn.addEventListener('click', () => this.goToPrevious());
                nextBtn.addEventListener('click', () => this.goToNext());

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => this.goToSlide(index));
                });

                // Auto-advance screenshots
                this.setupScreenshotRotation();
                
                // Update navigation state
                this.updateNavigation();
            }

            setupScreenshotRotation() {
                const screenshotContainers = document.querySelectorAll('.project-screenshots');
                screenshotContainers.forEach(container => {
                    const screenshots = container.querySelectorAll('.project-screenshot');
                    if (screenshots.length > 1) {
                        let currentScreenshot = 0;
                        setInterval(() => {
                            currentScreenshot = (currentScreenshot + 1) % screenshots.length;
                            container.style.transform = `translateX(-${currentScreenshot * 100}%)`;
                        }, 3000);
                    }
                });
            }

            goToPrevious() {
                this.currentIndex = this.currentIndex > 0 ? this.currentIndex - 1 : this.projects.length - 1;
                this.updateCarousel();
            }

            goToNext() {
                this.currentIndex = this.currentIndex < this.projects.length - 1 ? this.currentIndex + 1 : 0;
                this.updateCarousel();
            }

            goToSlide(index) {
                this.currentIndex = index;
                this.updateCarousel();
            }

            updateCarousel() {
                const carousel = document.getElementById('carousel');
                carousel.style.transform = `translateX(-${this.currentIndex * 100}%)`;
                this.updateNavigation();
            }

            updateNavigation() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const dots = document.querySelectorAll('.dot');

                // Update dots
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === this.currentIndex);
                });

                // Update buttons (disable if only one project)
                if (this.projects.length <= 1) {
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                } else {
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                }
            }

            showError(message) {
                const container = document.getElementById('projectsContainer');
                container.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        // Initialize the portfolio when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PortfolioCarousel();
        });
    </script>
</body>
</html>
