<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BearStick Studio - Team</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <!-- Hero Section with Logo -->
    <section class="hero-section" id="hero">
        <div class="hero-content">
            <div class="logo-container">
                <img src="logo.png" alt="BearStick Studio" class="studio-logo" id="studio-logo">
            </div>
            <div class="scroll-indicator">
                <div class="scroll-arrow">↓</div>
                <span>Scroll to meet the team</span>
            </div>
        </div>
    </section>

    <!-- Team Section -->
    <section class="team-wrapper" id="team-wrapper">
        <div class="container">
            <header class="header fade-in-section">
                <h1>🐻 BearStick Studio</h1>
                <p>Meet Our Team</p>
            </header>
            
            <main class="team-section">
                <div id="team-container">
                    <div class="loading-throbber">
                        <div class="loading-spinner"></div>
                    </div>
                    <div class="loading-text">Loading team...</div>
                </div>
            </main>
        </div>
    </section>

    <script src="bearstick.js"></script>
</body>
</html>
