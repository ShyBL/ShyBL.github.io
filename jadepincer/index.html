<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jade Pincer Chronicles</title>
    <meta name="description" content="Chronicles of the Jade Pincer campaign - A Legend of the Five Rings TTRPG adventure">
    <meta name="keywords" content="Legend of the Five Rings, L5R, TTRPG, Jade Pincer, Rokugan, samurai">
    <meta name="author" content="Chronicles of Rokugan">
    <link rel="stylesheet" href="../chronicles/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Jade Pincer Chronicles</h1>
            <p>A Legend of the Five Rings Campaign</p>
        </header>
        
        <main class="chronicles">
            <div id="session-container">
                <div class="loading-throbber">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading chronicles...</div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Configure for Jade Pincer Acts
        window.RokuganConfig = {
            folderPattern: 'Act-',
            folderCount: 6,
            navigationText: {
                previous: '← Previous Act',
                next: 'Next Act →'
            },
            demoSessions: null
        };
        console.log('Jade Pincer config loaded:', window.RokuganConfig);
    </script>
    <script src="../chronicles/script.js"></script>
    <script>
        console.log('Jade Pincer page loaded');
        console.log('Session container:', document.getElementById('session-container'));
    </script>
